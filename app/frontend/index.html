<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FlyRank Image Relevance Engine</title>
    <style>
        body {
            font-family: Arial, san-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
            color: #333;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            font-size: 16px;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #2563eb;
            color: white;
            border: none;
            
        }

        button:hover {
            background-color: #1e4ed8;
        }
    </style>
</head>
<body>

    <h1>FlyRank Image Relevance Engine</h1>
    <textarea id="blogText" placeholder="Paste your blog post text here..."></textarea>
    <br>
    <button id="matchButton">Find Matching Images</button> 

        <div id="results"></div>

    <script>
        const button = document.getElementById("matchButton");
        const textarea = document.getElementById("blogText");
        const resultsDiv = document.getElementById("results");

        button.addEventListener("click", async () => {
            const blogText = textarea.value;

            const response = await fetch("http://127.0.0.1:8000/match", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ blog_text: blogText, top_k: 3 }),
            });

            const data = await response.json();
          resultsDiv.innerHTML = "";

if (!data.matched) {
    resultsDiv.innerHTML = "<p>No confident match found.</p>";
} else {
    data.matches.forEach((match) => {
        const card = document.createElement("div");
        card.className = "match-card";
        card.innerHTML = `
            <strong>${match.filename}</strong>
            <p>${match.caption}</p>
            <small>Distance: ${match.distance.toFixed(4)}</small>
        `;
        resultsDiv.appendChild(card);
    });
}
        });
    </script>
</body>
</html>
